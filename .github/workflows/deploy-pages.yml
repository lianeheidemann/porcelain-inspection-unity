name: Deploy WebGL to GitHub Pages

# Publishes the WebGL build to GitHub Pages after ci.yml finishes building it
# on main. Reuses ci.yml's "Build-WebGL" artifact instead of building Unity
# again here, so this workflow never needs to activate a Unity license
# itself (Unity's personal license only allows one active session at a
# time - a second concurrent activation kills the first with exit code 137).
#
# One-time setup:
#   - Settings -> Pages -> Build and deployment -> Source = GitHub Actions
#   - Player Settings -> WebGL -> Publishing Settings: Compression Format = Disabled
#     (or keep Brotli/Gzip and enable Decompression Fallback) - GitHub Pages
#     cannot send Content-Encoding headers.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Package WebGL build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Find CI run to pull the WebGL artifact from
        id: ci_run
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_run') {
              core.setOutput('run_id', context.payload.workflow_run.id);
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            if (data.workflow_runs.length === 0) {
              core.setFailed('No successful CI run found on main to pull the WebGL build from.');
              return;
            }
            core.setOutput('run_id', data.workflow_runs[0].id);

      - name: Download WebGL build artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          path: build
          run-id: ${{ steps.ci_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
