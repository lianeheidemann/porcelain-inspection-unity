name: Acquire activation file

# TEMPORARY — used once to generate the Unity manual-activation (.alf) file.
# Steps:
#   1. Actions tab -> "Acquire activation file" -> Run workflow (branch: main)
#   2. Download the "Manual Activation File" artifact (.alf)
#   3. Go to https://license.unity3d.com/manual, upload the .alf, pick Unity
#      Personal, download the .ulf
#   4. Repo Settings -> Secrets and variables -> Actions -> new secret
#      UNITY_LICENSE = full contents of the .ulf
#   5. Delete this workflow file

on: workflow_dispatch

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.6.0f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
