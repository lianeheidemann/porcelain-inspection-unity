name: CI

# Requires repository secrets for Unity activation:
#   UNITY_LICENSE  - contents of the .ulf license file (personal license)
#   UNITY_EMAIL    - Unity account email
#   UNITY_PASSWORD - Unity account password
# See https://game.ci/docs/github/activation for how to generate them.
# Without these secrets the build job will fail to activate Unity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.targetPlatform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Unity's personal license only allows one active session at a time,
      # so run the matrix legs one after another instead of in parallel
      # (concurrent activations kill each other with exit code 137).
      max-parallel: 1
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - WebGL
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      # Unity's license activation occasionally gets killed (exit 137) right
      # after the handshake succeeds, before any real build work starts -
      # seen even with no other concurrent workflow run in this repo, so
      # it's an external/intermittent licensing hiccup rather than
      # something we can fully prevent. Retry once before failing for real.
      - name: Build
        id: build
        uses: game-ci/unity-builder@v4
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          versioning: None

      - name: Build (retry)
        id: build_retry
        if: steps.build.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          versioning: None

      - name: Fail if both build attempts failed
        if: steps.build.outcome == 'failure' && steps.build_retry.outcome == 'failure'
        run: exit 1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build
          retention-days: 14
